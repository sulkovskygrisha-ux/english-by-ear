*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:#000;font-family:Arial,Helvetica,sans-serif;line-height:1.35;overflow-x:hidden}
header{background:#000;color:#fff;padding:20px 16px;text-align:center}
h1{margin:0;font-size:1.8rem}
main{max-width:960px;margin:0 auto;padding:8px 16px 40px}
h2{font-size:1.6rem;margin:36px 0 0;padding-bottom:8px;border-bottom:4px solid #000}

.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:12px}
.card{border:2px solid #000;border-radius:8px;padding:14px;background:#fff}
.en{font-size:1.4rem;font-weight:700;margin:0;overflow-wrap:anywhere}
.uk{font-size:1.1rem;margin:4px 0 12px;overflow-wrap:anywhere}
.btns{display:flex;gap:8px}
button{flex:1;min-height:56px;font:inherit;font-size:1.05rem;font-weight:700;border:2px solid #000;border-radius:8px;cursor:pointer;padding:8px}
.go{background:#000;color:#fff}
.slow{background:#fff;color:#000}
button:focus-visible{outline:3px solid #000;outline-offset:3px;box-shadow:0 0 0 6px #fff}
#status{position:sticky;top:0;z-index:5;margin:0;padding:12px 16px;background:#000;color:#fff;font-weight:700;text-align:center}
#status[hidden]{display:none}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>

var LEVELS = ["A1","A2","B1","B2","C1"];
var synth = window.speechSynthesis, voices = [], statusEl = document.getElementById("status");
function say(m){ statusEl.textContent = m; statusEl.hidden = !m; }
function loadVoices(){ if(synth){ voices = synth.getVoices() || []; } }
function pickVoice(){
  var en = voices.filter(function(v){ return /^en([-_]|$)/i.test(v.lang); });
  for(var i=0;i<en.length;i++){ if(/^en[-_]US$/i.test(en[i].lang)) return en[i]; }
  return en[0] || null;
}
if(synth){ loadVoices(); if(synth.addEventListener) synth.addEventListener("voiceschanged", loadVoices); }
function speak(text, rate){
  if(!synth || typeof SpeechSynthesisUtterance === "undefined"){ say("Озвучення недоступне в цьому браузері."); return; }
  loadVoices();
  var v = pickVoice();
  synth.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate;
  if(v){ u.voice = v; u.lang = v.lang; }
  u.onstart = function(){ say(""); };
  u.onerror = function(e){ if(e.error !== "canceled" && e.error !== "interrupted") say("Не вдалося відтворити звук. Спробуйте ще раз."); };
  synth.speak(u);
}
function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
function card(it){
  var li = el("li","card");
  var en = el("p","en",it[0]); en.lang = "en";
  li.appendChild(en);
  li.appendChild(el("p","uk",it[1]));
  var b = el("div","btns");
  [["Прослухати","go",0.95],["Повільно","slow",0.75]].forEach(function(x){
    var btn = el("button",x[1],x[0]); btn.type = "button";
    btn.dataset.text = it[0]; btn.dataset.rate = x[2];
    btn.setAttribute("aria-label", x[0] + ": " + it[0]);
    b.appendChild(btn);
  });
  li.appendChild(b);
  return li;
}
var app = document.getElementById("app");
[["words","Слова"],["sentences","Речення"]].forEach(function(s){
  var sec = el("section"); sec.appendChild(el("h2",null,s[1]));
  LEVELS.forEach(function(l){
    sec.appendChild(el("h3",null,"Рівень " + l));
    var ul = el("ul","grid");
    DATA[s[0]][l].forEach(function(it){ ul.appendChild(card(it)); });
    sec.appendChild(ul);
  });
  app.appendChild(sec);
});
app.addEventListener("click", function(e){
  var b = e.target.closest("button[data-text]");
  if(b) speak(b.dataset.text, parseFloat(b.dataset.rate));
});
