<!DOCTYPE html>
<html lang="uk">
<head>

<title>Англійська на слух — A1–A2</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f3f6fb;color:#1b2434;line-height:1.45}
header{background:#1f4fd8;color:#fff;padding:20px 16px 12px}
header h1{margin:0 0 4px;font-size:1.5rem}
header p{margin:0;opacity:.9}
.wrap{max-width:1100px;margin:0 auto;padding:0 12px}
.tabs{position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.tabs .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
button{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid #1f4fd8;background:#fff;color:#1f4fd8;cursor:pointer;font-weight:600}
button:hover{background:#e8eefc}
button:focus-visible,select:focus-visible{outline:3px solid #ff9f1c;outline-offset:2px}
.tabs button{flex:0 0 auto;white-space:nowrap;border-color:#c5d0ea;color:#35435f}
.tabs button[aria-pressed="true"]{background:#1f4fd8;border-color:#1f4fd8;color:#fff;box-shadow:inset 0 -4px 0 #ff9f1c}
.modebar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.modebar button[aria-pressed="true"]{background:#1f4fd8;color:#fff}
#status{margin:8px 0;padding:10px 14px;border-radius:10px;background:#fff3cd;color:#664d03;display:none}
#status.show{display:block}
.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:32px;list-style:none;margin:0;padding-left:0}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(20,40,90,.1);display:flex;flex-direction:column;gap:8px;min-width:0}
.en{font-size:1.5rem;font-weight:700;margin:0;overflow-wrap:anywhere}
.uk{margin:0;font-size:1.05rem;color:#35435f}
.tip{margin:0;font-size:.92rem;color:#5a4a00;background:#fff8dc;border-radius:8px;padding:6px 10px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.actions button{flex:1 1 120px}
.slow{background:#1f4fd8;color:#fff}
.slow:hover{background:#173ca8}
.practice{background:#fff;border-radius:16px;padding:20px 16px;box-shadow:0 2px 8px rgba(20,40,90,.1);margin-bottom:32px}
.practice .count{color:#5b6780;margin:0 0 8px}
.hidden{display:none!important}
.answer{margin-top:12px}
.placeholder{font-size:1.2rem;color:#5b6780;margin:8px 0}
.primary{background:#1f4fd8;color:#fff}
.primary:hover{background:#173ca8}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Англійська на слух</h1>
    <p>Слухайте короткі фрази, розумійте їх і повторюйте вголос. Рівень A1–A2.</p>
  </div>
</header>

<nav class="tabs" aria-label="Теми">
  <div class="wrap" id="tabs" role="group"></div>
</nav>

<main class="wrap">
  <div class="modebar" role="group" aria-label="Режим">
    <button type="button" id="modeLearn" aria-pressed="true">Вчити фрази</button>
    <button type="button" id="modePractice" aria-pressed="false">Перевір себе</button>
  </div>
  <div id="status" role="alert" aria-live="assertive"></div>

  <section id="learn" aria-label="Список фраз">
    <h2 id="learnTitle"></h2>
    <ul class="grid" id="cards"></ul>
  </section>

  <section id="practice" class="hidden" aria-label="Тренування">
    <h2>Перевір себе</h2>
    <div class="practice">
      <p class="count" id="pCount" aria-live="polite"></p>
      <p class="placeholder" id="pHidden">Послухайте фразу, спробуйте зрозуміти її та повторіть уголос.</p>
      <div class="actions">
        <button type="button" id="pPlay" aria-label="Прослухати фразу у звичайному темпі">Прослухати</button>
        <button type="button" id="pSlow" class="slow" aria-label="Прослухати фразу повільно">Повільно</button>
      </div>
      <div class="answer hidden" id="pAnswer" aria-live="polite">
        <p class="en" id="pEn"></p>
        <p class="uk" id="pUk"></p>
        <p class="tip" id="pTip"></p>
      </div>
      <div class="actions" style="margin-top:12px">
        <button type="button" id="pShow" class="primary">Показати фразу й переклад</button>
        <button type="button" id="pNext">Наступна фраза</button>
      </div>
    </div>
  </section>
</main>

/* ---------- Озвучення ---------- */
const statusEl = document.getElementById("status");
let voices = [];
const synthOK = typeof window !== "undefined" && "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

function showStatus(msg) {
  statusEl.textContent = msg;
  statusEl.classList.toggle("show", !!msg);
}
function loadVoices() {
  if (!synthOK) return;
  voices = window.speechSynthesis.getVoices() || [];
}
function pickVoice() {
  return voices.find(v => v.lang && v.lang.replace("_", "-").toLowerCase() === "en-us") ||
         voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en")) || null;
}
function speak(text, rate) {
  if (!synthOK) {
    showStatus("Озвучення недоступне у цьому браузері. Спробуйте Chrome, Edge або Safari.");
    return false;
  }
  showStatus("");
  try {
    loadVoices();
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = rate;
    const v = pickVoice();
    if (v) u.voice = v;
    u.onerror = e => {
      if (e && (e.error === "canceled" || e.error === "interrupted")) return;
      showStatus("Не вдалося відтворити звук. Перевірте гучність і налаштування браузера та спробуйте ще раз.");
    };
    window.speechSynthesis.speak(u);
    return true;
  } catch (err) {
    showStatus("Сталася помилка озвучення. Спробуйте ще раз.");
    return false;
  }
}
if (synthOK) {
  loadVoices();
  if ("onvoiceschanged" in window.speechSynthesis) {
    window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
  }
}

/* ---------- Інтерфейс ---------- */
const tabsEl = document.getElementById("tabs");
const cardsEl = document.getElementById("cards");
const learnTitle = document.getElementById("learnTitle");
const learnSec = document.getElementById("learn");
const practiceSec = document.getElementById("practice");
const modeLearn = document.getElementById("modeLearn");
const modePractice = document.getElementById("modePractice");
let theme = THEMES[0];
let mode = "learn";
let pIndex = 0;

const byTheme = t => PHRASES.filter(p => p.theme === t);

function renderTabs() {
  tabsEl.innerHTML = "";
  THEMES.forEach(t => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t;
    b.setAttribute("aria-pressed", String(t === theme));
    b.addEventListener("click", () => { theme = t; pIndex = 0; render(); });
    tabsEl.appendChild(b);
  });
}

function renderCards() {
  learnTitle.textContent = "Тема: " + theme;
  cardsEl.innerHTML = "";
  byTheme(theme).forEach(p => {
    const li = document.createElement("li");
    li.className = "card";
    const en = document.createElement("p"); en.className = "en"; en.lang = "en"; en.textContent = p.en;
    const uk = document.createElement("p"); uk.className = "uk"; uk.textContent = p.uk;
    const tip = document.createElement("p"); tip.className = "tip"; tip.textContent = "Підказка: " + p.tip;
    const act = document.createElement("div"); act.className = "actions";
    const b1 = document.createElement("button");
    b1.type = "button"; b1.className = "play"; b1.textContent = "Прослухати";
    b1.setAttribute("aria-label", "Прослухати фразу: " + p.en);
    b1.dataset.text = p.en; b1.dataset.rate = RATE_NORMAL;
    b1.addEventListener("click", () => speak(p.en, RATE_NORMAL));
    const b2 = document.createElement("button");
    b2.type = "button"; b2.className = "slow"; b2.textContent = "Повільно";
    b2.setAttribute("aria-label", "Прослухати повільно: " + p.en);
    b2.dataset.text = p.en; b2.dataset.rate = RATE_SLOW;
    b2.addEventListener("click", () => speak(p.en, RATE_SLOW));
    act.append(b1, b2);
    li.append(en, uk, tip, act);
    cardsEl.appendChild(li);
  });
}

const pEn = document.getElementById("pEn"), pUk = document.getElementById("pUk"),
      pTip = document.getElementById("pTip"), pAnswer = document.getElementById("pAnswer"),
      pHidden = document.getElementById("pHidden"), pCount = document.getElementById("pCount"),
      pShow = document.getElementById("pShow");

function currentPhrase() { const l = byTheme(theme); return l[pIndex % l.length]; }

function renderPractice() {
  const l = byTheme(theme), p = currentPhrase();
  pCount.textContent = "Тема: " + theme + " · Фраза " + (pIndex % l.length + 1) + " з " + l.length;
  pEn.textContent = p.en; pUk.textContent = p.uk; pTip.textContent = "Підказка: " + p.tip;
  hideAnswer();
}
function hideAnswer() {
  pAnswer.classList.add("hidden");
  pHidden.classList.remove("hidden");
  pShow.setAttribute("aria-expanded", "false");
}
function showAnswer() {
  pAnswer.classList.remove("hidden");
  pHidden.classList.add("hidden");
  pShow.setAttribute("aria-expanded", "true");
}

document.getElementById("pPlay").addEventListener("click", () => speak(currentPhrase().en, RATE_NORMAL));
document.getElementById("pSlow").addEventListener("click", () => speak(currentPhrase().en, RATE_SLOW));
pShow.addEventListener("click", showAnswer);
document.getElementById("pNext").addEventListener("click", () => {
  pIndex = (pIndex + 1) % byTheme(theme).length;
  if (synthOK) window.speechSynthesis.cancel();
  renderPractice();
});

function setMode(m) {
  mode = m;
  modeLearn.setAttribute("aria-pressed", String(m === "learn"));
  modePractice.setAttribute("aria-pressed", String(m === "practice"));
  learnSec.classList.toggle("hidden", m !== "learn");
  practiceSec.classList.toggle("hidden", m !== "practice");
  render();
}
modeLearn.addEventListener("click", () => setMode("learn"));
modePractice.addEventListener("click", () => setMode("practice"));

function render() {
  renderTabs();
  if (mode === "learn") renderCards(); else renderPractice();
}
render();

/* Самоперевірка: window.selfTest() у консолі */
window.selfTest = function () {
  const r = {};
  THEMES.forEach(t => r[t] = byTheme(t).length);
  r.total = PHRASES.length;
  r.uniqueEn = new Set(PHRASES.map(p => p.en)).size;
  r.slowLessThanNormal = RATE_SLOW < RATE_NORMAL;
  return r;
};
</script>
